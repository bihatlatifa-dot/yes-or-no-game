<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamza's Yes or No Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    overflow:hidden;
}

.card{
    background:white;
    padding:40px;
    border-radius:25px;
    text-align:center;
    width:90%;
    max-width:550px;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
}

h1{
    color:#2a5298;
    margin-bottom:15px;
}

p{
    font-size:22px;
    margin-bottom:30px;
}

.buttons{
    position:relative;
    height:150px;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:12px;
    font-size:20px;
    cursor:pointer;
    transition:0.2s;
}

#yesBtn{
    background:#22c55e;
    color:white;
    margin-right:20px;
}

#yesBtn:hover{
    transform:scale(1.1);
}

#noBtn{
    background:#ef4444;
    color:white;
    position:absolute;
}

#result{
    margin-top:20px;
    font-size:28px;
    font-weight:bold;
    color:#22c55e;
}

.confetti{
    position:absolute;
    width:10px;
    height:10px;
    animation:fall 3s linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-100px) rotate(0deg);
    }
    to{
        transform:translateY(100vh) rotate(720deg);
    }
}
</style>

</head>
<body>

<div class="card">

<h1>🎮 Hamza Bihat's Game</h1>

<p>Do you think Hamza is amazing? 😎</p>

<div class="buttons">
<button id="yesBtn">YES ❤️</button>
<button id="noBtn">NO 😅</button>
</div>

<div id="result"></div>

</div>

<script>

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {

const x = Math.random() * 300;
const y = Math.random() * 100;

noBtn.style.left = x + "px";
noBtn.style.top = y + "px";

});

document.getElementById("yesBtn").addEventListener("click", () => {

document.getElementById("result").innerHTML =
"🎉 Correct! Hamza is amazing! 🎉";

for(let i=0;i<150;i++){

const confetti = document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left = Math.random()*100 + "vw";

confetti.style.backgroundColor =
`hsl(${Math.random()*360},100%,50%)`;

document.body.appendChild(confetti);

setTimeout(()=>{
confetti.remove();
},3000);

}

});

</script>

</body>
</html>

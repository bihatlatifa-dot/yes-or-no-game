<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamza's Amazing Game ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;

    background-image:url("image.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;
}

.overlay{
    background:rgba(0,0,0,0.55);
    padding:40px;
    border-radius:25px;
    text-align:center;
    color:white;
    width:90%;
    max-width:600px;
}

h1{
    font-size:40px;
    margin-bottom:20px;
}

p{
    font-size:24px;
    margin-bottom:25px;
}

button{
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    margin:10px;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
}

#noBtn{
    background:#444;
    color:white;
}

#result{
    margin-top:25px;
    font-size:28px;
    font-weight:bold;
}

.heart{
    position:fixed;
    font-size:30px;
    animation:floatUp 4s linear forwards;
    pointer-events:none;
}

@keyframes floatUp{
    from{
        transform:translateY(0);
        opacity:1;
    }

    to{
        transform:translateY(-500px);
        opacity:0;
    }
}

</style>
</head>
<body>

<div class="overlay">

<h1>💖 Hamza Bihat's Game 💖</h1>

<p>Do you think Latifa is amazing? 😎❤️</p>

<button id="yesBtn">YES ❤️</button>
<button id="noBtn">NO 😅</button>

<div id="result"></div>

</div>

<script>

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const result = document.getElementById("result");

const messages = [
"Really? 🤨",
"Think Again 😏",
"Wrong Answer 😂",
"Are You Sure? 😭",
"Last Chance 😆"
];

let count = 0;

noBtn.addEventListener("mouseover", function(){

    noBtn.innerHTML =
    messages[count % messages.length];

    count++;

    noBtn.style.position = "fixed";

    noBtn.style.left =
    Math.random() * (window.innerWidth - 150) + "px";

    noBtn.style.top =
    Math.random() * (window.innerHeight - 80) + "px";

    yesBtn.style.transform =
    "scale(" + (1 + count * 0.1) + ")";
});

yesBtn.addEventListener("click", function(){

    result.innerHTML =
    "✅ CORRECT ANSWER! OFC U ARE THE MOST BEAUTIFUL GIRL IN THE WORLD ANGEL! ❤️";

    for(let i=0;i<100;i++){

        const heart =
        document.createElement("div");

        heart.className = "heart";

        heart.innerHTML = "❤️";

        heart.style.left =
        Math.random() * 100 + "vw";

        heart.style.top =
        Math.random() * 100 + "vh";

        document.body.appendChild(heart);

        setTimeout(function(){
            heart.remove();
        },4000);
    }
});

</script>

</body>
</html>
